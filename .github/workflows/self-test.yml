name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  positive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./
        with:
          dockerfile: cmd/self/Dockerfile
          service-name: pyroscope-smoke-test
          search-term: smokeTestMagicFunction
          timeout-seconds: '60'

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./
        id: smoke
        continue-on-error: true
        with:
          dockerfile: cmd/self/Dockerfile
          service-name: pyroscope-smoke-test
          search-term: definitelyNotARealFunction
          timeout-seconds: '60'
      - name: Assert failure
        if: steps.smoke.outcome != 'failure'
        run: |
          echo "Expected action to fail with wrong magic string but it succeeded"
          exit 1
