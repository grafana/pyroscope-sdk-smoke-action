name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  positive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          dockerfile: cmd/self/Dockerfile
          service-name: pyroscope-smoke-test
          search-term: smokeTestMagicFunction
          timeout-seconds: '60'

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: smoke
        continue-on-error: true
        with:
          dockerfile: cmd/self/Dockerfile
          service-name: pyroscope-smoke-test
          search-term: definitelyNotARealFunction
          timeout-seconds: '60'
      - name: Assert failure
        if: steps.smoke.outcome != 'failure'
        run: |
          echo "Expected action to fail with wrong magic string but it succeeded"
          exit 1
