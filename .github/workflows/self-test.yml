name: Self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  positive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./
        with:
          dockerfile: cmd/self/Dockerfile
          service-name: pyroscope-smoke-test
          search-term: smokeTestMagicFunction
          timeout-seconds: '60'

  negative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./
        id: smoke
        continue-on-error: true
        with:
          dockerfile: cmd/self/Dockerfile
          service-name: pyroscope-smoke-test
          search-term: definitelyNotARealFunction
          timeout-seconds: '60'
      - name: Assert failure
        if: steps.smoke.outcome != 'failure'
        run: |
          echo "Expected action to fail with wrong magic string but it succeeded"
          exit 1
